<!doctype html>
<meta charset="utf-8">
<body>Loading asset smoke test...</body>
<script>
  const result = { error: null, checks: [] };
  const check = (name, condition) => {
    if (!condition) throw new Error(name);
    result.checks.push(name);
  };

  const finish = () => {
    const text = "ASSET_SMOKE_RESULT:" + JSON.stringify(result);
    document.body.textContent = text;
    document.title = text;
  };

  const waitFor = (predicate, timeout = 10000) => new Promise((resolve, reject) => {
    const start = performance.now();
    const poll = () => {
      const value = predicate();
      if (value) {
        resolve(value);
        return;
      }
      if (performance.now() - start > timeout) {
        reject(new Error("timed out waiting for the game world"));
        return;
      }
      setTimeout(poll, 50);
    };
    poll();
  });

  const nextFrames = (win, count) => new Promise((resolve) => {
    let remaining = count;
    let settled = false;
    const done = () => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      resolve();
    };
    // Hidden/offscreen frames can throttle rAF; never hang the whole page.
    const timer = setTimeout(done, 400 * count + 400);
    const step = () => {
      if (settled) return;
      remaining -= 1;
      if (remaining <= 0) done();
      else win.requestAnimationFrame(step);
    };
    win.requestAnimationFrame(step);
  });

  const saturation = (hex) => {
    const value = String(hex).replace("#", "");
    const channels = [0, 2, 4].map((offset) => parseInt(value.slice(offset, offset + 2), 16) / 255);
    const max = Math.max(...channels);
    const min = Math.min(...channels);
    return max === 0 ? 0 : (max - min) / max;
  };

  const longestAxisRatios = (forms) => forms.map((form) => {
    const axes = [form.bounds.x, form.bounds.y, form.bounds.z];
    return Math.max(...axes) / Math.min(...axes);
  });

  const ratiosAreDistinct = (forms) => {
    const ratios = longestAxisRatios(forms).sort((a, b) => a - b);
    return ratios.every((ratio, index) => index === 0 || ratio - ratios[index - 1] > 0.05);
  };

  const frame = document.createElement("iframe");
  frame.src = "../index.html?test=1";
  frame.width = 1280;
  frame.height = 900;
  frame.style.cssText = "position:absolute;left:-16000px;top:0;border:0;";
  frame.onerror = () => {
    result.error = "failed to load index.html";
    finish();
  };
  frame.onload = async () => {
    try {
      const win = frame.contentWindow;
      const api = await waitFor(() => win.starRingTestApi || null);
      const ready = await waitFor(() => win.starRingWorldReady || null);
      await ready;

      // The merged page has no start panel: ?test=1 boots straight into a run,
      // so the pause panel is the only place the way home may appear.
      await waitFor(() => win.document.getElementById("overlay")?.classList.contains("hidden"));
      const bootReturn = win.document.getElementById("back-home");
      const bootOverlayClean =
        Boolean(bootReturn) &&
        bootReturn.hidden === true &&
        win.document.getElementById("overlay").classList.contains("hidden");

      api.startGame();
      await nextFrames(win, 2);

      const arena = api.getWorldDebug();
      check(
        "world is 60 km open space without a fence",
        arena.world.width === 60000 &&
          arena.world.height === 60000 &&
          arena.world.depth === 60000 &&
          arena.fence === false
      );

      check(
        "procedural nebula, planet and dust layers are present",
        arena.environment &&
          arena.environment.nebula === true &&
          arena.environment.planet === true &&
          arena.environment.dustLayers === 2 &&
          arena.environment.fence === false
      );

      api.resolveRouteChoice("forge");
      const forgeTint = api.getWorldDebug().environment.tint;
      api.startGame();
      const driftTint = api.getWorldDebug().environment.tint;
      check(
        "region tint reaches the deep-space environment and resets on restart",
        forgeTint === "255,166,98" && driftTint === "98,228,255"
      );

      check("world debug exposes the fighter", typeof api.getWorldDebug === "function" && Boolean(api.getWorldDebug()?.fighter));
      const debug = api.getWorldDebug();

      const bounds = debug.fighter.bounds;
      check(
        "fighter local bounds match the target envelope",
        bounds.z >= 170 && bounds.z <= 195 && bounds.x >= 150 && bounds.x <= 185 && bounds.y > 0 && bounds.y <= 50
      );

      const parts = debug.fighter.parts;
      check(
        "wings mirror and dorsal tails sit high and apart",
        parts.rightWing.x > 0 &&
          parts.leftWing.x < 0 &&
          Math.abs(parts.rightWing.x + parts.leftWing.x) <= 1 &&
          parts.leftTail.y > 0 &&
          parts.rightTail.y > 0 &&
          Math.abs(parts.leftTail.x - parts.rightTail.x) > 5
      );

      const flames = debug.fighter.flames || [];
      check(
        "cockpit forward, twin engines aft, flames behind",
        parts.cockpit.z > 0 &&
          parts.leftEngine.z < -50 &&
          parts.rightEngine.z < -50 &&
          flames.length === 4 &&
          flames.every((flame) => flame.z < parts.leftEngine.z && flame.z < parts.rightEngine.z)
      );

      api.selectSkin("default");
      api.selectColor("blue");
      const blueFighter = api.getWorldDebug().fighter;
      api.selectColor("red");
      const redFighter = api.getWorldDebug().fighter;
      check(
        "livery tints engines only",
        saturation(blueFighter.hullColor) < 0.1 &&
          redFighter.hullColor === blueFighter.hullColor &&
          redFighter.engineColor !== blueFighter.engineColor
      );

      const navLights = api.getWorldDebug().fighter.navLights || [];
      const portLight = navLights.find((light) => light.color === "#ff4d5e");
      const starboardLight = navLights.find((light) => light.color === "#4dff9e");
      check(
        "navigation lights are red to port and green to starboard",
        navLights.length === 2 &&
          Boolean(portLight) &&
          portLight.x > 0 &&
          Boolean(starboardLight) &&
          starboardLight.x < 0
      );

      api.pauseGame();
      const forms = api.getWorldDebug().rocks.forms;
      check(
        "three rock forms are unique and normalized",
        forms.length === 3 &&
          new Set(forms.map((form) => form.id)).size === 3 &&
          forms.every((form) =>
            form.triangles > 0 &&
            form.triangles <= 6000 &&
            Math.abs(form.maxRadius - 1) <= 0.01 &&
            form.maxHalfExtent <= 1 &&
            form.vertexRadius <= 1.0001 &&
            Math.abs(form.vertexRadius - 1) <= 0.01
          ) &&
          ratiosAreDistinct(forms)
      );
      {
        const THREE = await win.Function("return import('three')")();
        const { createRockSet } = await win.Function("return import('/rock-models.js')")();
        const rocks = createRockSet();
        const resources = new Set(rocks.forms.flatMap((form) => [form.geometry, form.material, form.colorMap, form.bumpMap]));
        let disposed = 0;
        resources.forEach((resource) => resource.addEventListener("dispose", () => { disposed++; }));
        try {
          check("refined rocks stay within the 4000 triangle budget",
            rocks.forms.every((form) => (form.geometry.index?.count ?? form.geometry.attributes.position.count) / 3 <= 4000));
          let seamsMatch = true, polesMatch = true, roughnessPacked = true, geometryFinite = true;
          for (const form of rocks.forms) {
            for (const texture of [form.colorMap, form.bumpMap]) {
              const { width, height } = texture.image;
              const pixels = texture.image.getContext("2d").getImageData(0, 0, width, height).data;
              seamsMatch &&= texture.wrapS === THREE.RepeatWrapping;
              for (let y = 0; y < height; y++) for (let channel = 0; channel < 4; channel++) {
                seamsMatch &&= pixels[(y * width) * 4 + channel] === pixels[(y * width + width - 1) * 4 + channel];
              }
              for (const y of [0, height - 1]) for (let x = 1; x < width; x++) for (let channel = 0; channel < 4; channel++) {
                polesMatch &&= pixels[(y * width + x) * 4 + channel] === pixels[y * width * 4 + channel];
              }
              if (texture === form.bumpMap) {
                let minHeight = 255, maxHeight = 0, independent = false;
                for (let index = 0; index < pixels.length; index += 4) {
                  roughnessPacked &&= pixels[index + 1] >= 170;
                  minHeight = Math.min(minHeight, pixels[index]); maxHeight = Math.max(maxHeight, pixels[index]);
                  independent ||= Math.abs(pixels[index] - pixels[index + 1]) > 30;
                }
                roughnessPacked &&= independent && maxHeight - minHeight > 30 &&
                  form.material.bumpMap === texture && form.material.roughnessMap === texture && texture.colorSpace === THREE.NoColorSpace;
              }
            }
            const positions = form.geometry.attributes.position, normals = form.geometry.attributes.normal;
            for (let index = 0; index < positions.count; index++) {
              geometryFinite &&= [positions.getX(index), positions.getY(index), positions.getZ(index)].every(Number.isFinite) &&
                Math.hypot(positions.getX(index), positions.getY(index), positions.getZ(index)) <= 1.0001 &&
                Math.abs(Math.hypot(normals.getX(index), normals.getY(index), normals.getZ(index)) - 1) < 0.01;
            }
          }
          check("rock colour and relief repeat without a longitude seam", seamsMatch);
          check("rock maps meet consistently at both poles", polesMatch);
          check("rock relief and matte roughness use independent packed channels", roughnessPacked);
          check("refined rocks keep finite unit geometry and normals", geometryFinite);
          const fractured = rocks.forms.find((form) => form.id === "fractured");
          const fragment = new THREE.Mesh(fractured.geometry, fractured.material);
          const surface = [-0.2, 0, 0.2].map((x) => new THREE.Raycaster(new THREE.Vector3(x, 0, 3),
            new THREE.Vector3(0, 0, -1)).intersectObject(fragment)[0]?.point.z);
          check("fractured rock exposes a coherent break face instead of a rounded pit",
            surface.every(Number.isFinite) && Math.abs(surface[0] + surface[2] - 2 * surface[1]) < 0.025);
          let outerProjection = -Infinity;
          const fracturedPositions = fractured.geometry.attributes.position;
          for (let index = 0; index < fracturedPositions.count; index++) {
            outerProjection = Math.max(outerProjection, fracturedPositions.getX(index) * 0.35 / 1.2 +
              fracturedPositions.getY(index) * 0.1 / 0.82 + fracturedPositions.getZ(index) / 0.85);
          }
          check("fractured rim does not protrude past its break plane", outerProjection <= surface[1] / 0.85 + 0.025);
        } finally {
          // Also release locally generated resources when a visual assertion fails.
          rocks.dispose();
        }
        check("rock set releases exactly its three geometries materials and six maps", resources.size === 12 && disposed === 12);
      }

      api.clearAsteroids();
      await nextFrames(win, 2);
      await waitFor(() => api.getWorldDebug().rocks.active === 0);

      const formIds = forms.map((form) => form.id);
      const playerAt = api.getScene().player;
      for (let i = 0; i < 30; i += 1) {
        api.spawnAsteroidAt(
          playerAt.x + 120 + (i % 5) * 90,
          playerAt.y + 120 + Math.floor(i / 5) * 90,
          playerAt.z + 400,
          30,
          formIds[i % formIds.length]
        );
      }
      await nextFrames(win, 2);
      const populated = await waitFor(() => {
        const rocks = api.getWorldDebug().rocks;
        return rocks.active === 30 ? rocks : null;
      });
      check(
        "thirty asteroids share geometries but clone materials",
        populated.uniqueGeometryIds.length === 3 && populated.uniqueMaterialCount === 30
      );

      check(
        "visual radius matches collision radius",
        populated.items.length === 30 &&
          populated.items.every((item) =>
            Math.abs(item.scale - item.radius) <= 0.3 &&
            Math.abs(item.visualRadius - item.scale * item.maxRadius) <= 0.01
          )
      );

      const geometryIdsBefore = [...populated.uniqueGeometryIds].sort();
      api.clearAsteroids();
      await nextFrames(win, 2);
      const emptied = await waitFor(() => {
        const rocks = api.getWorldDebug().rocks;
        return rocks.active === 0 ? rocks : null;
      });
      formIds.forEach((formId) => api.spawnAsteroidAt(playerAt.x + 600, playerAt.y + 400, playerAt.z + 800, 30, formId));
      await nextFrames(win, 2);
      const respawned = await waitFor(() => {
        const rocks = api.getWorldDebug().rocks;
        return rocks.active === 3 ? rocks : null;
      });
      check(
        "clearAsteroids empties the field without touching shared geometry",
        emptied.uniqueMaterialCount === 0 &&
          [...respawned.uniqueGeometryIds].sort().join(",") === geometryIdsBefore.join(",")
      );

      const firstFighter = api.getWorldDebug().fighter;
      api.selectSkin("delta");
      const deltaFighter = api.getWorldDebug().fighter;
      api.selectSkin("default");
      const restoredFighter = api.getWorldDebug().fighter;
      check(
        "skin switching restores the fighter textures",
        firstFighter &&
          deltaFighter &&
          restoredFighter &&
          restoredFighter.textureCount === firstFighter.textureCount
      );
      check(
        "delta ship has layered hard-surface detail",
        deltaFighter.detail?.canopyFrame === true &&
          deltaFighter.detail?.intakeLouverCount >= 4 &&
          deltaFighter.detail?.nozzleCoreCount === 2 &&
          deltaFighter.detail?.panelAccentCount >= 6
      );

      // Mouse look must reach the chase camera in the same tick: any smoothing
      // makes the view trail the mouse and keep turning after input stops.
      api.startGame();
      await nextFrames(win, 2);
      const gameDocument = win.document;
      const gameCanvas = gameDocument.getElementById("game");
      Object.defineProperty(gameDocument, "pointerLockElement", { configurable: true, get: () => gameCanvas });
      gameDocument.dispatchEvent(new win.Event("pointerlockchange"));
      const lookMove = new win.MouseEvent("mousemove", { bubbles: true });
      Object.defineProperty(lookMove, "movementX", { value: 120 });
      Object.defineProperty(lookMove, "movementY", { value: 60 });
      gameDocument.dispatchEvent(lookMove);
      api.tick(1 / 60);
      const lookScene = api.getScene();
      check(
        "camera follows mouse look without trailing",
        Math.abs(lookScene.player.yaw) > 1e-6 &&
          Math.abs(lookScene.camera.yaw - lookScene.player.yaw) < 1e-9 &&
          Math.abs(lookScene.camera.pitch - lookScene.player.pitch) < 1e-9
      );
      // Browser pointer lock sometimes reports a bogus half-window step; that
      // must not rotate the view.
      const spikeMove = new win.MouseEvent("mousemove", { bubbles: true });
      Object.defineProperty(spikeMove, "movementX", { value: 600 });
      Object.defineProperty(spikeMove, "movementY", { value: -600 });
      gameDocument.dispatchEvent(spikeMove);
      api.tick(1 / 60);
      const spikeScene = api.getScene();
      check(
        "mouse look ignores pointer-lock movement spikes",
        Math.abs(spikeScene.player.yaw - lookScene.player.yaw) < 1e-9 &&
          Math.abs(spikeScene.player.pitch - lookScene.player.pitch) < 1e-9
      );
      delete gameDocument.pointerLockElement;
      gameDocument.dispatchEvent(new win.Event("pointerlockchange"));

      api.startGame();
      api.clearAsteroids();
      api.setPlayerPosition(30000, 30000, 30000, 0, 0);
      win.dispatchEvent(new win.KeyboardEvent("keydown", { key: "w" }));
      for (let i = 0; i < 120; i += 1) {
        api.clearAsteroids();
        api.tick(1 / 60);
      }
      const cruise = api.getScene();
      win.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Shift" }));
      for (let i = 0; i < 120; i += 1) {
        api.clearAsteroids();
        api.tick(1 / 60);
      }
      const boosted = api.getScene();
      win.dispatchEvent(new win.KeyboardEvent("keyup", { key: "Shift" }));
      const boostDelta = boosted.player.z - cruise.player.z;
      for (let i = 0; i < 120; i += 1) {
        api.clearAsteroids();
        api.tick(1 / 60);
      }
      const released = api.getScene();
      const releaseDelta = released.player.z - boosted.player.z;
      // 1150–1500 is unreachable: boost speed 544.5 for 2s is 1089, and the
      // ramp up from cruise 330 covers ~1052. A window under that ceiling
      // still rejects cruise (~660) and a 2x multiplier (~1261).
      check(
        "boost raises forward speed only while held",
        cruise.player.boost === false &&
          boosted.player.boost === true &&
          boostDelta > 1000 &&
          boostDelta < 1120 &&
          releaseDelta > boostDelta * 0.55 &&
          releaseDelta < boostDelta * 0.8 &&
          // The exhaust cue must follow the boost, not stay pinned at cruise.
          cruise.player.thrust <= 1.0 &&
          boosted.player.thrust > 1.15
      );

      for (const key of ["w", "a", "s", "d", "Shift"]) {
        win.dispatchEvent(new win.KeyboardEvent("keyup", { key }));
      }
      // Same start, same frames. A shared accel leak moves the Shift run ~4%
      // farther; a speed leak moves it ~65%. Both must stay inside 2%.
      const coast = (keys, shift, yaw = 0) => {
        api.setPlayerPosition(30000, 30000, 30000, yaw, 0);
        for (const key of keys) win.dispatchEvent(new win.KeyboardEvent("keydown", { key }));
        if (shift) win.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Shift" }));
        for (let i = 0; i < 120; i += 1) {
          api.clearAsteroids();
          api.tick(1 / 60);
        }
        const scene = api.getScene();
        for (const key of keys) win.dispatchEvent(new win.KeyboardEvent("keyup", { key }));
        if (shift) win.dispatchEvent(new win.KeyboardEvent("keyup", { key: "Shift" }));
        return scene;
      };
      const close = (plain, shifted) => {
        const delta = Math.abs(plain - shifted);
        return Math.abs(plain) > 100 && delta <= Math.abs(plain) * 0.02;
      };
      const strafePlain = coast("d", false);
      const strafeShift = coast("d", true);
      check(
        "boost does not speed up strafing",
        strafePlain.player.boost === false &&
          strafeShift.player.boost === false &&
          close(strafePlain.player.x - 30000, strafeShift.player.x - 30000)
      );
      const reversePlain = coast("s", false);
      const reverseShift = coast("s", true);
      check(
        "boost does not speed up reverse",
        reversePlain.player.boost === false &&
          reverseShift.player.boost === false &&
          close(reversePlain.player.z - 30000, reverseShift.player.z - 30000)
      );
      for (const yaw of [0, 0.6]) {
        const plain = coast("wd", false, yaw);
        const shifted = coast("wd", true, yaw);
        const lateral = ({ player }) => (player.x - 30000) * Math.cos(yaw) +
          (player.z - 30000) * Math.sin(yaw);
        check(
          `diagonal boost keeps ordinary lateral acceleration at yaw ${yaw}`,
          plain.player.boost === false && shifted.player.boost === true &&
            close(lateral(plain), lateral(shifted))
        );
      }

      api.startGame();
      await nextFrames(win, 2);
      api.beginRouteChoice();
      api.tick(1 / 60);
      const gateReport = api.getWorldDebug().gates;
      const gateState = api.getState();
      check(
        "warp gates show what they are and where they lead",
        gateReport.length === 2 &&
          gateReport.every((gate) => gate.hasLabel === true && gate.label.length > 0) &&
          gateReport.every((gate) => gate.visualLayers === 4) &&
          new Set(gateReport.map((gate) => gate.regionId)).size === 2 &&
          gateState.bannerTimer > 2.3 &&
          gateState.bannerTimer <= 2.5
      );
      api.startGame();
      api.beginRouteChoice();
      const nearGate = api.getState().gates[0];
      const nearGateRegion = nearGate.regionId;
      api.setPlayerPosition(nearGate.x + 57, nearGate.y, nearGate.z, 0, 0);
      api.tick(1 / 60);
      const crossedAt57 = api.getState();
      api.startGame();
      api.beginRouteChoice();
      const farGate = api.getState().gates[0];
      api.setPlayerPosition(farGate.x + 59, farGate.y, farGate.z, 0, 0);
      api.tick(1 / 60);
      const rejectedAt59 = api.getState();
      check(
        "warp gate contact matches the visible ring",
        crossedAt57.regionId === nearGateRegion &&
          crossedAt57.gates.length === 0 &&
          rejectedAt59.gates.length === 2
      );
      // The flight leaves cores inside the pickup cull radius.
      api.startGame();

      const near = api.getScene().player;
      api.clearAsteroids();
      api.spawnAsteroidAt(near.x + 1000, near.y, near.z, 30);
      api.spawnAsteroidAt(near.x + 2700, near.y, near.z, 30);
      api.spawnCoreAt(near.x + 1000, near.y, near.z);
      api.spawnCoreAt(near.x + 2100, near.y, near.z);
      api.tick(1 / 60);
      const recycled = api.getState();
      check(
        "distant rocks and pickups recycle while the near field stays",
        recycled.asteroidCount === 1 && recycled.coreCount === 1
      );
      api.spawnCoreAt(near.x + 1100, near.y, near.z);
      api.spawnPowerUpAt(near.x + 1200, near.y, near.z, "shield");
      api.spawnPowerUpAt(near.x + 1300, near.y, near.z, "double");
      // Headless throttles rAF for the offscreen iframe; a resize schedules a
      // draw through setTimeout, which still runs.
      win.dispatchEvent(new win.Event("resize"));
      await nextFrames(win, 2);
      await waitFor(() => {
        const variants = new Set(
          (api.getWorldDebug().pickups.items || []).map((item) => item.variant)
        );
        return ["core", "shield", "double"].every((variant) => variants.has(variant));
      });
      const pickupReport = api.getWorldDebug().pickups;
      const pickupByVariant = Object.fromEntries(
        (pickupReport?.items || []).map((item) => [item.variant, item])
      );
      const corePickup = pickupByVariant.core;
      const shieldPickup = pickupByVariant.shield;
      const doublePickup = pickupByVariant.double;
      check(
        "reward silhouettes stay distinct without a glow sprite",
        Boolean(corePickup && shieldPickup && doublePickup) &&
          [corePickup, shieldPickup, doublePickup].every(
            (pickup) => pickup.hasGlow === false && pickup.beamOpacity <= 0.08
          ) &&
          corePickup.size.y > corePickup.size.x * 1.4 &&
          shieldPickup.size.x > shieldPickup.size.z * 2 &&
          doublePickup.size.x > doublePickup.size.z * 1.2 &&
          new Set(
            [corePickup, shieldPickup, doublePickup].map(
              (pickup) => `${pickup.size.x}x${pickup.size.y}x${pickup.size.z}`
            )
           ).size === 3
      );
      check(
        "reward models read as layered devices",
        corePickup.detail?.shell === true &&
          shieldPickup.detail?.frame === true &&
          doublePickup.detail?.connectorCount === 2 &&
          [corePickup, shieldPickup, doublePickup].every((pickup) => pickup.detail?.componentCount >= 5)
      );
      {
        const THREE = await win.Function("return import('three')")();
        const { createPickupModel } = await win.Function("return import('/pickup-models.js')")();
        const pickups = [createPickupModel({ kind: "core", radius: 4 }),
          createPickupModel({ kind: "powerUp", type: "shield", radius: 4 }),
          createPickupModel({ kind: "powerUp", type: "double", radius: 4 })];
        pickups.forEach((pickup) => pickup.updateWorldMatrix(true, true));
        const hit = (object, origin, direction) => new THREE.Raycaster(new THREE.Vector3(...origin),
          new THREE.Vector3(...direction)).intersectObject(object, true)[0]?.point;
        const coreBody = pickups[0].userData.pickup.body;
        const collarInner = hit(coreBody.children[1], [0, 0, 0], [1, 0, 0])?.x;
        const coreOuter = hit(coreBody.children[0], [5, 0, 0], [-1, 0, 0])?.x;
        check("core collar joins the cell shell instead of floating around it", collarInner <= coreOuter + 0.03);
        const shieldBody = pickups[1].userData.pickup.body;
        const frameInner = hit(shieldBody, [0, 0, 0.18], [1, 0, 0])?.x;
        const plateOuter = hit(shieldBody.children[0], [7, 0, 0.18], [-1, 0, 0])?.x;
        check("shield frame overlaps its backing plate", frameInner <= plateOuter + 0.06);
        const doubleBody = pickups[2].userData.pickup.body;
        const shoulderLow = hit(doubleBody, [-1.65, 2.90, 5], [0, 0, -1])?.z;
        const shoulderHigh = hit(doubleBody, [-1.65, 2.98, 5], [0, 0, -1])?.z;
        check("double-cell shoulders taper continuously into their terminals",
          shoulderLow > shoulderHigh && shoulderLow - shoulderHigh < 0.18);
        const doubleSignals = [1, -1].map((side) => new THREE.Raycaster(new THREE.Vector3(-1.65, 0, side * 5),
          new THREE.Vector3(0, 0, -side)).intersectObject(doubleBody, true)[0]?.object.material);
        check("double energy windows stay readable from both front and back",
          doubleSignals.every((material) => material?.isMeshBasicMaterial && material.toneMapped === false && material.color.getHex() === 0xe9b161));
        let budgetSafe = true, surfacesFinite = true;
        for (const pickup of pickups) {
          let triangles = 0, meshes = 0;

      const landingStage = landingDoc.getElementById("stage");
      const fullscreenSupported = (typeof landingStage.requestFullscreen === "function" &&
        landingDoc.fullscreenEnabled !== false) ||
        (typeof landingStage.webkitRequestFullscreen === "function" && landingDoc.webkitFullscreenEnabled !== false);
      const fullscreenInitiallyCorrect = Boolean(fullscreenButton) &&
        fullscreenButton.hidden === !fullscreenSupported &&
        fullscreenButton.getAttribute("aria-pressed") === "false";
      const settingsPanel = landingDoc.querySelector(".settings-panel");
      const settingsStyle = settingsPanel ? showcaseWin.getComputedStyle(settingsPanel) : null;
      const settingsLayered = Boolean(settingsPanel && settingsStyle) &&
        Number.parseFloat(settingsStyle.borderRadius) >= 16 &&
        settingsStyle.boxShadow !== "none" &&
        landingDoc.querySelectorAll(".settings-section").length === 5 &&
        landingDoc.querySelector(".toggle-btn.active")?.getAttribute("aria-pressed") === "true";
      check(
        "settings panel has a layered HUD treatment",
        settingsLayered
      );
      let fullscreenToggleWorks = fullscreenButton?.hidden === true;
      if (fullscreenSupported) {
        await showcase.toggleFullscreen();
        if (!fullscreenButton.hidden) {
          await waitFor(() => fullscreenButton.getAttribute("aria-pressed") === "true");
          const pressed = fullscreenButton.getAttribute("aria-pressed") === "true";
          await showcase.toggleFullscreen();
          await waitFor(() => fullscreenButton.getAttribute("aria-pressed") === "false");
          fullscreenToggleWorks = pressed && fullscreenButton.getAttribute("aria-pressed") === "false";
        } else {
          fullscreenToggleWorks = fullscreenButton.hidden === true;
        }
      }
      // Entering the game is a view switch in the same document, and the browser
      // back button (a hash entry) returns to the landing view.
      startLink?.click();
      const enteredGame = startLink ? await waitFor(() => {
        const gameShown = landingDoc.getElementById("game-view").hidden === false;
        const landingHidden = landingDoc.getElementById("landing").hidden === true;
        return gameShown && landingHidden ? true : null;
      }, 30000) : false;
      const bootedGameCanvas = landingDoc.getElementById("game");
      const canvasSized = Boolean(bootedGameCanvas) && bootedGameCanvas.width >= 320 && bootedGameCanvas.height >= 240;
      showcaseWin.history.back();
      const returnedToLanding = await waitFor(
        () => landingDoc.getElementById("landing").hidden === false ? true : null,
        10000
      );
      // The game scripts are loaded by now, so a key press on the landing view
      // would reach them. Prove the view gate blocks it — and, in the second
      // arm, that the same key still starts a run when the view is active.
      const spaceKey = { key: " ", code: "Space", preventDefault() {} };
      const probeStart = (viewActive) => {
        let started = false;
        const probe = win.starRingInput.createInputController({
          windowObject: win,
          documentObject: win.document,
          getState: () => ({ running: false, gameOver: true, paused: false }),
          fireLaser: () => {},
          startGame: () => { started = true; },
          togglePause: () => {},
          pauseGame: () => {},
          isGameViewActive: () => viewActive
        });
        probe.handleKeyDown(spaceKey);
        return started;
      };
      const keysIgnoredOnLanding = probeStart(false) === false;
      const keysLiveInGame = probeStart(true) === true;
      check(
        "landing page offers the game, the controls, fullscreen, enters and leaves the game view, and ignores game keys there",
        Boolean(startLink) &&
          startLink.tagName === "BUTTON" &&
          Boolean(controlsCard) &&
          /WASD/.test(controlsCard.textContent) &&
          /Shift/.test(controlsCard.textContent) &&
          /触屏：.*开火.*暂停/.test(controlsCard.textContent) &&
          Boolean(fullscreenButton) &&
          fullscreenInitiallyCorrect &&
          fullscreenToggleWorks &&
          fullscreenButton.getAttribute("aria-pressed") === "false" &&
          enteredGame === true &&
          canvasSized &&
          returnedToLanding === true &&
          keysIgnoredOnLanding &&
          keysLiveInGame
      );

      // Each mode is asserted while its panel is actually open, not merely
      // closed: a way home leaking onto the game-over screen must fail.
      const overlayEl = win.document.getElementById("overlay");
      const panelOpen = () => !overlayEl.classList.contains("hidden");
      const returnState = () => {
        const el = win.document.getElementById("back-home");
        return { present: Boolean(el), hidden: el?.hidden, tag: el?.tagName, href: el?.getAttribute("href") };
      };

      api.startGame();
      await nextFrames(win, 2);
      api.pauseGame();
      await nextFrames(win, 2);
      const pauseReturn = returnState();
      const pausePanelOpen = panelOpen();
      api.resumeGame();
      await nextFrames(win, 2);
      api.endGame();
      await nextFrames(win, 2);
      const overReturn = returnState();
      const gameOverPanelOpen = panelOpen();
      check(
        "only the pause panel offers a way back to the landing page",
        bootOverlayClean &&
          pausePanelOpen &&
          pauseReturn.present &&
          pauseReturn.hidden === false &&
          pauseReturn.tag === "BUTTON" &&
          pauseReturn.href === null &&
          gameOverPanelOpen &&
          overReturn.present &&
          overReturn.hidden === true
      );
      api.startGame();
      await nextFrames(win, 2);

      // Machine prerequisites only: these do not establish physical-device feel.
      for (const axis of ["x", "y", "z"]) {
        for (const side of ["lower", "upper"]) {
          api.startGame();
          api.clearAsteroids();
          const position = { x: 30000, y: 30000, z: 30000 };
          position[axis] = side === "lower" ? 0 : 60000;
          api.setPlayerPosition(position.x, position.y, position.z, 0, 0);
          api.tick(0);
          const pushed = api.getScene().player;
          const pushCorrect = Math.abs(pushed[axis] - (side === "lower" ? 55.9 : 59944.1)) < 1e-8 &&
            ["x", "y", "z"].filter((other) => other !== axis).every((other) => pushed[other] === 30000);

          const yaw = axis === "x" ? (side === "lower" ? Math.PI / 2 : -Math.PI / 2)
            : axis === "z" && side === "lower" ? Math.PI : 0;
          const pitch = axis === "y" ? (side === "lower" ? -1.15 : 1.15) : 0;
          position[axis] = side === "lower" ? 85 : 59915;
          api.setPlayerPosition(position.x, position.y, position.z, yaw, pitch);
          win.dispatchEvent(new win.KeyboardEvent("keydown", { key: "w", code: "KeyW" }));
          api.tick(1 / 60);
          win.dispatchEvent(new win.KeyboardEvent("keyup", { key: "w", code: "KeyW" }));
          for (let tick = 0; tick < 30; tick += 1) api.tick(1 / 60);
          const coasted = api.getScene().player;
          check(`${axis} ${side} soft boundary pushes inward without wrapping and reverses outward momentum`,
            pushCorrect && (side === "lower" ? coasted[axis] > 86 && coasted[axis] < 100
              : coasted[axis] < 59914 && coasted[axis] > 59900));

          api.startGame();
          api.clearAsteroids();
          position[axis] = side === "lower" ? 1000 : 59000;
          api.setPlayerPosition(position.x, position.y, position.z, 0, 0);
          position[axis] = side === "lower" ? 61 : 59939;
          const rock = api.spawnAsteroidAt(position.x, position.y, position.z, 30, "angular");
          rock[`v${axis}`] = side === "lower" ? -100 : 100;
          api.stepAsteroids(0.02);
          const bounced = api.getScene().asteroids[0];
          api.stepAsteroids(0.02);
          const inward = api.getScene().asteroids[0];
          check(`${axis} ${side} asteroid wall bounce clamps once and keeps moving inward`,
            bounced?.[axis] === (side === "lower" ? 60 : 59940) &&
            bounced?.[`v${axis}`] === (side === "lower" ? 85 : -85) &&
            Math.abs((inward?.[axis] ?? NaN) - (side === "lower" ? 61.7 : 59938.3)) < 1e-8 &&
            ["x", "y", "z"].filter((other) => other !== axis).every((other) => inward[other] === 30000));

          api.startGame();
          api.clearAsteroids();
          position[axis] = side === "lower" ? 85 : 59915;
          api.setPlayerPosition(position.x, position.y, position.z, 0, 0);
          position[axis] += side === "lower" ? -50 : 50;
          const eliteContact = api.spawnAsteroidAt(position.x, position.y, position.z, 60, "angular");
          eliteContact.elite = true;
          api.handleCollisions();
          api.tick(1 / 60);
          const repelled = api.getScene().player;
          check(`${axis} ${side} boundary preserves inward knockback from an elite collision`,
            side === "lower" ? repelled[axis] > 86 && repelled[axis] < 100
              : repelled[axis] < 59914 && repelled[axis] > 59900);
        }
      }

      for (const [elite, limit] of [[false, 2600], [true, 3200]]) {
        api.startGame();
        api.clearAsteroids();
        api.setPlayerPosition(30000, 30000, 30000, 0, 0);
        const atLimit = api.spawnAsteroidAt(30000 + limit, 30000, 30000, 30, "angular");
        const beyond = api.spawnAsteroidAt(30001 + limit, 30000, 30000, 30, "angular");
        atLimit.elite = beyond.elite = elite;
        api.stepAsteroids(0);
        const retained = api.getScene().asteroids;
        check(`${elite ? "elite" : "ordinary"} distance recycling retains its radius boundary and removes farther rocks`,
          retained.length === 1 && retained[0].x === 30000 + limit && retained[0].elite === elite);
      }

      // GPU memory: renderer.info counts what the GPU still holds. Compare two
      // equally-warmed snapshots so transient asteroids cannot skew the result:
      // a leak keeps climbing, a healthy scene returns to the same level.
      // Exercise the offscreen-rAF failure: GPU checks must drive real renders.
      const scheduledFrame = win.requestAnimationFrame;
      win.requestAnimationFrame = () => 0;
      api.startGame();
      api.pauseGame();
      api.clearAsteroids();
      api.renderWorld();
      api.selectSkin("delta");
      api.renderWorld();
      api.selectSkin("saucer");
      api.renderWorld();
      api.selectSkin("default");
      api.clearAsteroids();
      api.renderWorld();
      const gpuWarm = api.getWorldDebug().gpu;
      for (let cycle = 0; cycle < 5; cycle += 1) {
        api.selectSkin("delta");
        api.tick(1 / 60);
        api.renderWorld();
        api.selectSkin("saucer");
        api.tick(1 / 60);
        api.renderWorld();
        api.selectSkin("default");
        api.tick(1 / 60);
        api.renderWorld();
      }
      api.clearAsteroids();
      api.renderWorld();
      const gpuSkins = api.getWorldDebug().gpu;
      for (let cycle = 0; cycle < 5; cycle += 1) {
        api.startGame();
        api.pauseGame();
        api.clearAsteroids();
        api.tick(1 / 60);
        api.renderWorld();
      }
      api.clearAsteroids();
      api.renderWorld();
      const gpuRestarts = api.getWorldDebug().gpu;
      win.requestAnimationFrame = scheduledFrame;
      // A throttled or unpainted frame leaves every counter at its empty level
      // and would make the equality checks pass trivially, so require that the
      // scene actually uploaded its geometry first.
      const gpuFlat =
        gpuWarm.geometries > 40 &&
        gpuWarm.textures > 4 &&
        gpuSkins.geometries === gpuWarm.geometries &&
        gpuSkins.textures === gpuWarm.textures &&
        gpuRestarts.geometries === gpuWarm.geometries &&
        gpuRestarts.textures === gpuWarm.textures;
      if (!gpuFlat) {
        throw new Error(
          `GPU counters drifted: warm=${JSON.stringify(gpuWarm)} skins=${JSON.stringify(gpuSkins)} restarts=${JSON.stringify(gpuRestarts)}`
        );
      }
      check("skin switching and restarts hold GPU memory flat", gpuFlat);

      // GPU counters alone are render-timing dependent, so pair them with the
      // deterministic release accounting: after the effects expire, everything
      // the FX pool created must have been disposed exactly once.
      api.resumeGame();
      for (let burst = 0; burst < 5; burst += 1) {
        api.destroyAsteroidAt(30200 + burst * 40, 30000, 30200, 30, false);
        for (let frame = 0; frame < 60; frame += 1) api.tick(1 / 60);
      }
      const fxSettled = api.getWorldDebug().fx;
      check(
        "destruction effects release everything they allocate",
        fxSettled.debrisGroups === 0 &&
          fxSettled.shards === 0 &&
          fxSettled.sparks === 0 &&
          fxSettled.rings === 0 &&
          fxSettled.stats.disposedMaterials === fxSettled.stats.createdMaterials &&
          fxSettled.stats.disposedGeometries === fxSettled.stats.createdGeometries
      );
      api.clearAsteroids();

      // Terminal check: no game API assertions may follow world disposal.
      api.startGame();
      api.clearAsteroids();
      api.setPlayerPosition(30000, 30000, 30000, 0, 0);
      api.destroyAsteroidAt(30000, 30000, 30200, 30, false);
      api.tick(1 / 60);
      const beforeDispose = api.getWorldDebug().fx;
      const afterDispose = api.disposeWorld();
      check("world disposal releases live FX and its shared ring geometry",
        beforeDispose.debrisGroups === 1 && beforeDispose.materials === materialsPerGroup &&
          afterDispose.debrisGroups === 0 && afterDispose.shards === 0 && afterDispose.sparks === 0 &&
          afterDispose.rings === 0 && afterDispose.flashes === 0 && afterDispose.materials === 0 &&
          afterDispose.stats.disposedMaterials - beforeDispose.stats.disposedMaterials === materialsPerGroup &&
          afterDispose.stats.disposedGeometries - beforeDispose.stats.disposedGeometries === 1 &&
          afterDispose.stats.disposedMaterials === afterDispose.stats.createdMaterials &&
          afterDispose.stats.disposedGeometries === afterDispose.stats.createdGeometries &&
          afterDispose.stats.disposedRingGeometries - beforeDispose.stats.disposedRingGeometries === 1);
    } catch (error) {
      result.error = error.message;
    }
    finish();
  };
  document.body.append(frame);
</script>
