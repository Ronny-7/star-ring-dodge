<!doctype html>
<meta charset="utf-8">
<body>Loading asset smoke test...</body>
<script>
  const result = { error: null, checks: [] };
  const check = (name, condition) => {
    if (!condition) throw new Error(name);
    result.checks.push(name);
  };

  const finish = () => {
    const text = "ASSET_SMOKE_RESULT:" + JSON.stringify(result);
    document.body.textContent = text;
    document.title = text;
  };

  const waitFor = (predicate, timeout = 10000) => new Promise((resolve, reject) => {
    const start = performance.now();
    const poll = () => {
      const value = predicate();
      if (value) {
        resolve(value);
        return;
      }
      if (performance.now() - start > timeout) {
        reject(new Error("timed out waiting for the game world"));
        return;
      }
      setTimeout(poll, 50);
    };
    poll();
  });

  const nextFrames = (win, count) => new Promise((resolve) => {
    let remaining = count;
    let settled = false;
    const done = () => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      resolve();
    };
    // Hidden/offscreen frames can throttle rAF; never hang the whole page.
    const timer = setTimeout(done, 400 * count + 400);
    const step = () => {
      if (settled) return;
      remaining -= 1;
      if (remaining <= 0) done();
      else win.requestAnimationFrame(step);
    };
    win.requestAnimationFrame(step);
  });

  const saturation = (hex) => {
    const value = String(hex).replace("#", "");
    const channels = [0, 2, 4].map((offset) => parseInt(value.slice(offset, offset + 2), 16) / 255);
    const max = Math.max(...channels);
    const min = Math.min(...channels);
    return max === 0 ? 0 : (max - min) / max;
  };

  const longestAxisRatios = (forms) => forms.map((form) => {
    const axes = [form.bounds.x, form.bounds.y, form.bounds.z];
    return Math.max(...axes) / Math.min(...axes);
  });

  const ratiosAreDistinct = (forms) => {
    const ratios = longestAxisRatios(forms).sort((a, b) => a - b);
    return ratios.every((ratio, index) => index === 0 || ratio - ratios[index - 1] > 0.05);
  };

  const frame = document.createElement("iframe");
  frame.src = "../index.html?test=1";
  frame.width = 1280;
  frame.height = 900;
  frame.style.cssText = "position:absolute;left:-16000px;top:0;border:0;";
  frame.onerror = () => {
    result.error = "failed to load index.html";
    finish();
  };
  frame.onload = async () => {
    try {
      const win = frame.contentWindow;
      const api = await waitFor(() => win.starRingTestApi || null);
      const ready = await waitFor(() => win.starRingWorldReady || null);
      await ready;
      api.startGame();
      await nextFrames(win, 2);

      const arena = api.getWorldDebug();
      check(
        "world is 60 km open space without a fence",
        arena.world.width === 60000 &&
          arena.world.height === 60000 &&
          arena.world.depth === 60000 &&
          arena.fence === false
      );

      check(
        "procedural nebula, planet and dust layers are present",
        arena.environment &&
          arena.environment.nebula === true &&
          arena.environment.planet === true &&
          arena.environment.dustLayers === 2 &&
          arena.environment.fence === false
      );

      api.resolveRouteChoice("forge");
      const forgeTint = api.getWorldDebug().environment.tint;
      api.startGame();
      const driftTint = api.getWorldDebug().environment.tint;
      check(
        "region tint reaches the deep-space environment and resets on restart",
        forgeTint === "255,166,98" && driftTint === "98,228,255"
      );

      check("world debug exposes the fighter", typeof api.getWorldDebug === "function" && Boolean(api.getWorldDebug()?.fighter));
      const debug = api.getWorldDebug();

      const bounds = debug.fighter.bounds;
      check(
        "fighter local bounds match the target envelope",
        bounds.z >= 170 && bounds.z <= 195 && bounds.x >= 150 && bounds.x <= 185 && bounds.y > 0 && bounds.y <= 50
      );

      const parts = debug.fighter.parts;
      check(
        "wings mirror and dorsal tails sit high and apart",
        parts.rightWing.x > 0 &&
          parts.leftWing.x < 0 &&
          Math.abs(parts.rightWing.x + parts.leftWing.x) <= 1 &&
          parts.leftTail.y > 0 &&
          parts.rightTail.y > 0 &&
          Math.abs(parts.leftTail.x - parts.rightTail.x) > 5
      );

      const flames = debug.fighter.flames || [];
      check(
        "cockpit forward, twin engines aft, flames behind",
        parts.cockpit.z > 0 &&
          parts.leftEngine.z < -50 &&
          parts.rightEngine.z < -50 &&
          flames.length === 4 &&
          flames.every((flame) => flame.z < parts.leftEngine.z && flame.z < parts.rightEngine.z)
      );

      api.selectSkin("default");
      api.selectColor("blue");
      const blueFighter = api.getWorldDebug().fighter;
      api.selectColor("red");
      const redFighter = api.getWorldDebug().fighter;
      check(
        "livery tints engines only",
        saturation(blueFighter.hullColor) < 0.1 &&
          redFighter.hullColor === blueFighter.hullColor &&
          redFighter.engineColor !== blueFighter.engineColor
      );

      const navLights = api.getWorldDebug().fighter.navLights || [];
      const portLight = navLights.find((light) => light.color === "#ff4d5e");
      const starboardLight = navLights.find((light) => light.color === "#4dff9e");
      check(
        "navigation lights are red to port and green to starboard",
        navLights.length === 2 &&
          Boolean(portLight) &&
          portLight.x > 0 &&
          Boolean(starboardLight) &&
          starboardLight.x < 0
      );

      api.pauseGame();
      const forms = api.getWorldDebug().rocks.forms;
      check(
        "three rock forms are unique and normalized",
        forms.length === 3 &&
          new Set(forms.map((form) => form.id)).size === 3 &&
          forms.every((form) =>
            form.triangles > 0 &&
            form.triangles <= 6000 &&
            Math.abs(form.maxRadius - 1) <= 0.01 &&
            form.maxHalfExtent <= 1 &&
            form.vertexRadius <= 1.0001 &&
            Math.abs(form.vertexRadius - 1) <= 0.01
          ) &&
          ratiosAreDistinct(forms)
      );

      api.clearAsteroids();
      await nextFrames(win, 2);
      await waitFor(() => api.getWorldDebug().rocks.active === 0);

      const formIds = forms.map((form) => form.id);
      const playerAt = api.getScene().player;
      for (let i = 0; i < 30; i += 1) {
        api.spawnAsteroidAt(
          playerAt.x + 120 + (i % 5) * 90,
          playerAt.y + 120 + Math.floor(i / 5) * 90,
          playerAt.z + 400,
          30,
          formIds[i % formIds.length]
        );
      }
      await nextFrames(win, 2);
      const populated = await waitFor(() => {
        const rocks = api.getWorldDebug().rocks;
        return rocks.active === 30 ? rocks : null;
      });
      check(
        "thirty asteroids share geometries but clone materials",
        populated.uniqueGeometryIds.length === 3 && populated.uniqueMaterialCount === 30
      );

      check(
        "visual radius matches collision radius",
        populated.items.length === 30 &&
          populated.items.every((item) =>
            Math.abs(item.scale - item.radius) <= 0.3 &&
            Math.abs(item.visualRadius - item.scale * item.maxRadius) <= 0.01
          )
      );

      const geometryIdsBefore = [...populated.uniqueGeometryIds].sort();
      api.clearAsteroids();
      await nextFrames(win, 2);
      const emptied = await waitFor(() => {
        const rocks = api.getWorldDebug().rocks;
        return rocks.active === 0 ? rocks : null;
      });
      formIds.forEach((formId) => api.spawnAsteroidAt(playerAt.x + 600, playerAt.y + 400, playerAt.z + 800, 30, formId));
      await nextFrames(win, 2);
      const respawned = await waitFor(() => {
        const rocks = api.getWorldDebug().rocks;
        return rocks.active === 3 ? rocks : null;
      });
      check(
        "clearAsteroids empties the field without touching shared geometry",
        emptied.uniqueMaterialCount === 0 &&
          [...respawned.uniqueGeometryIds].sort().join(",") === geometryIdsBefore.join(",")
      );

      const firstFighter = api.getWorldDebug().fighter;
      api.selectSkin("delta");
      const deltaFighter = api.getWorldDebug().fighter;
      api.selectSkin("default");
      const restoredFighter = api.getWorldDebug().fighter;
      check(
        "skin switching restores the fighter textures",
        firstFighter &&
          deltaFighter &&
          restoredFighter &&
          restoredFighter.textureCount === firstFighter.textureCount
      );

      // Mouse look must reach the chase camera in the same tick: any smoothing
      // makes the view trail the mouse and keep turning after input stops.
      api.startGame();
      await nextFrames(win, 2);
      const gameDocument = win.document;
      const gameCanvas = gameDocument.getElementById("game");
      Object.defineProperty(gameDocument, "pointerLockElement", { configurable: true, get: () => gameCanvas });
      gameDocument.dispatchEvent(new win.Event("pointerlockchange"));
      const lookMove = new win.MouseEvent("mousemove", { bubbles: true });
      Object.defineProperty(lookMove, "movementX", { value: 120 });
      Object.defineProperty(lookMove, "movementY", { value: 60 });
      gameDocument.dispatchEvent(lookMove);
      api.tick(1 / 60);
      const lookScene = api.getScene();
      check(
        "camera follows mouse look without trailing",
        Math.abs(lookScene.player.yaw) > 1e-6 &&
          Math.abs(lookScene.camera.yaw - lookScene.player.yaw) < 1e-9 &&
          Math.abs(lookScene.camera.pitch - lookScene.player.pitch) < 1e-9
      );
      // Browser pointer lock sometimes reports a bogus half-window step; that
      // must not rotate the view.
      const spikeMove = new win.MouseEvent("mousemove", { bubbles: true });
      Object.defineProperty(spikeMove, "movementX", { value: 600 });
      Object.defineProperty(spikeMove, "movementY", { value: -600 });
      gameDocument.dispatchEvent(spikeMove);
      api.tick(1 / 60);
      const spikeScene = api.getScene();
      check(
        "mouse look ignores pointer-lock movement spikes",
        Math.abs(spikeScene.player.yaw - lookScene.player.yaw) < 1e-9 &&
          Math.abs(spikeScene.player.pitch - lookScene.player.pitch) < 1e-9
      );
      delete gameDocument.pointerLockElement;
      gameDocument.dispatchEvent(new win.Event("pointerlockchange"));

      api.startGame();
      api.clearAsteroids();
      api.setPlayerPosition(30000, 30000, 30000, 0, 0);
      win.dispatchEvent(new win.KeyboardEvent("keydown", { key: "w" }));
      for (let i = 0; i < 120; i += 1) {
        api.clearAsteroids();
        api.tick(1 / 60);
      }
      const cruise = api.getScene();
      win.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Shift" }));
      for (let i = 0; i < 120; i += 1) {
        api.clearAsteroids();
        api.tick(1 / 60);
      }
      const boosted = api.getScene();
      win.dispatchEvent(new win.KeyboardEvent("keyup", { key: "Shift" }));
      const boostDelta = boosted.player.z - cruise.player.z;
      for (let i = 0; i < 120; i += 1) {
        api.clearAsteroids();
        api.tick(1 / 60);
      }
      const released = api.getScene();
      const releaseDelta = released.player.z - boosted.player.z;
      // 1150–1500 is unreachable: boost speed 544.5 for 2s is 1089, and the
      // ramp up from cruise 330 covers ~1052. A window under that ceiling
      // still rejects cruise (~660) and a 2x multiplier (~1261).
      check(
        "boost raises forward speed only while held",
        cruise.player.boost === false &&
          boosted.player.boost === true &&
          boostDelta > 1000 &&
          boostDelta < 1120 &&
          releaseDelta > boostDelta * 0.55 &&
          releaseDelta < boostDelta * 0.8 &&
          // The exhaust cue must follow the boost, not stay pinned at cruise.
          cruise.player.thrust <= 1.0 &&
          boosted.player.thrust > 1.15
      );

      for (const key of ["w", "a", "s", "d", "Shift"]) {
        win.dispatchEvent(new win.KeyboardEvent("keyup", { key }));
      }
      // Same start, same frames. A shared accel leak moves the Shift run ~4%
      // farther; a speed leak moves it ~65%. Both must stay inside 2%.
      const coast = (key, shift) => {
        api.setPlayerPosition(30000, 30000, 30000, 0, 0);
        win.dispatchEvent(new win.KeyboardEvent("keydown", { key }));
        if (shift) win.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Shift" }));
        for (let i = 0; i < 120; i += 1) {
          api.clearAsteroids();
          api.tick(1 / 60);
        }
        const scene = api.getScene();
        win.dispatchEvent(new win.KeyboardEvent("keyup", { key }));
        if (shift) win.dispatchEvent(new win.KeyboardEvent("keyup", { key: "Shift" }));
        return scene;
      };
      const close = (plain, shifted) => {
        const delta = Math.abs(plain - shifted);
        return Math.abs(plain) > 100 && delta <= Math.abs(plain) * 0.02;
      };
      const strafePlain = coast("d", false);
      const strafeShift = coast("d", true);
      check(
        "boost does not speed up strafing",
        strafePlain.player.boost === false &&
          strafeShift.player.boost === false &&
          close(strafePlain.player.x - 30000, strafeShift.player.x - 30000)
      );
      const reversePlain = coast("s", false);
      const reverseShift = coast("s", true);
      check(
        "boost does not speed up reverse",
        reversePlain.player.boost === false &&
          reverseShift.player.boost === false &&
          close(reversePlain.player.z - 30000, reverseShift.player.z - 30000)
      );

      api.startGame();
      await nextFrames(win, 2);
      api.beginRouteChoice();
      api.tick(1 / 60);
      const gateReport = api.getWorldDebug().gates;
      const gateState = api.getState();
      check(
        "warp gates show what they are and where they lead",
        gateReport.length === 2 &&
          gateReport.every((gate) => gate.hasLabel === true && gate.label.length > 0) &&
          new Set(gateReport.map((gate) => gate.regionId)).size === 2 &&
          gateState.bannerTimer > 2.3 &&
          gateState.bannerTimer <= 2.5
      );
      // The flight leaves cores inside the pickup cull radius.
      api.startGame();

      const near = api.getScene().player;
      api.clearAsteroids();
      api.spawnAsteroidAt(near.x + 1000, near.y, near.z, 30);
      api.spawnAsteroidAt(near.x + 2700, near.y, near.z, 30);
      api.spawnCoreAt(near.x + 1000, near.y, near.z);
      api.spawnCoreAt(near.x + 2100, near.y, near.z);
      api.tick(1 / 60);
      const recycled = api.getState();
      check(
        "distant rocks and pickups recycle while the near field stays",
        recycled.asteroidCount === 1 && recycled.coreCount === 1
      );
      api.spawnCoreAt(near.x + 1100, near.y, near.z);
      api.spawnPowerUpAt(near.x + 1200, near.y, near.z, "shield");
      api.spawnPowerUpAt(near.x + 1300, near.y, near.z, "double");
      // Headless throttles rAF for the offscreen iframe; a resize schedules a
      // draw through setTimeout, which still runs.
      win.dispatchEvent(new win.Event("resize"));
      await nextFrames(win, 2);
      await waitFor(() => {
        const variants = new Set(
          (api.getWorldDebug().pickups.items || []).map((item) => item.variant)
        );
        return ["core", "shield", "double"].every((variant) => variants.has(variant));
      });
      const pickupReport = api.getWorldDebug().pickups;
      const pickupByVariant = Object.fromEntries(
        (pickupReport?.items || []).map((item) => [item.variant, item])
      );
      const corePickup = pickupByVariant.core;
      const shieldPickup = pickupByVariant.shield;
      const doublePickup = pickupByVariant.double;
      check(
        "reward silhouettes stay distinct without a glow sprite",
        Boolean(corePickup && shieldPickup && doublePickup) &&
          [corePickup, shieldPickup, doublePickup].every(
            (pickup) => pickup.hasGlow === false && pickup.beamOpacity <= 0.08
          ) &&
          corePickup.size.y > corePickup.size.x * 1.4 &&
          shieldPickup.size.x > shieldPickup.size.z * 2 &&
          doublePickup.size.x > doublePickup.size.z * 1.2 &&
          new Set(
            [corePickup, shieldPickup, doublePickup].map(
              (pickup) => `${pickup.size.x}x${pickup.size.y}x${pickup.size.z}`
            )
          ).size === 3
      );
      api.clearAsteroids();

      api.startGame();
      api.clearAsteroids();
      api.setPlayerPosition(30000, 30000, 30000, 0, 0);
      const before = api.getWorldDebug();
      const reducedFx = Math.min(win.innerWidth, win.innerHeight) < 480 || win.navigator.maxTouchPoints > 0;
      const shardsPerGroup = reducedFx ? 3 : 5;
      const materialsPerGroup = shardsPerGroup + 3;
      const target = api.spawnAsteroidAt(30000, 30000, 30200, 30, "angular");
      target.hp = 0;
      api.destroyAsteroidAt(30000, 30000, 30200, 30, false);
      api.tick(1 / 60);
      win.dispatchEvent(new win.Event("resize"));
      await new Promise((resolve) => win.setTimeout(resolve, 20));
      const burst = api.getWorldDebug().fx;
      check(
        "destroyed asteroids throw shards, a flash, a ring and sparks",
        burst.debrisGroups === 1 && burst.shards === shardsPerGroup &&
          burst.flashes > 0 && burst.sparks > 0 && burst.rings > 0 &&
          burst.lights === before.lights && burst.stats.sharedGeometryDisposals === 0
      );
      for (let i = 0; i < 12; i += 1) {
        api.destroyAsteroidAt(30400 + i * 20, 30000, 30200, 30, false);
        // Sync each kill so this exercises eviction, not queued-event dropping.
        api.getWorldDebug();
      }
      api.tick(1 / 60);
      win.dispatchEvent(new win.Event("resize"));
      await new Promise((resolve) => win.setTimeout(resolve, 20));
      const capped = api.getWorldDebug().fx;
      check("debris groups are capped and cleaned up",
        capped.debrisGroups === 8 && capped.shards === 8 * shardsPerGroup &&
          capped.stats.createdMaterials - before.fx.stats.createdMaterials === 13 * materialsPerGroup &&
          capped.stats.disposedMaterials - burst.stats.disposedMaterials >= 5 * shardsPerGroup &&
          capped.stats.disposedGeometries - burst.stats.disposedGeometries === 5 &&
          capped.stats.sharedGeometryDisposals === 0);
      for (let i = 0; i < 90; i += 1) api.tick(1 / 60);
      const settled = api.getWorldDebug().fx;
      check("effects expire and release their materials",
        settled.debrisGroups === 0 && settled.shards === 0 && settled.sparks === 0 &&
          settled.rings === 0 && settled.flashes === 0 && settled.materials === 0 &&
          settled.stats.disposedMaterials > capped.stats.disposedMaterials &&
          settled.stats.disposedMaterials - before.fx.stats.disposedMaterials === 13 * materialsPerGroup &&
          settled.stats.disposedMaterials === settled.stats.createdMaterials &&
          settled.stats.disposedGeometries - before.fx.stats.disposedGeometries === 13 &&
          settled.stats.disposedGeometries === settled.stats.createdGeometries &&
          settled.stats.sharedGeometryDisposals === 0);

      api.destroyAsteroidAt(30000, 30000, 30200, 30, false);
      api.tick(1 / 60);
      const beforeReset = api.getWorldDebug().fx;
      api.startGame();
      api.tick(1 / 60);
      const afterReset = api.getWorldDebug().fx;
      check("reset releases live FX resources",
        beforeReset.debrisGroups === 1 && beforeReset.materials === materialsPerGroup &&
          afterReset.debrisGroups === 0 && afterReset.shards === 0 && afterReset.sparks === 0 &&
          afterReset.rings === 0 && afterReset.flashes === 0 && afterReset.materials === 0 &&
          afterReset.stats.disposedMaterials - beforeReset.stats.disposedMaterials === materialsPerGroup &&
          afterReset.stats.disposedGeometries - beforeReset.stats.disposedGeometries === 1 &&
          afterReset.stats.disposedMaterials === afterReset.stats.createdMaterials &&
          afterReset.stats.disposedGeometries === afterReset.stats.createdGeometries &&
          afterReset.stats.sharedGeometryDisposals === 0);

      for (const skin of ["default", "delta", "saucer"]) {
        api.selectSkin(skin);
        const report = api.getWorldDebug().fighter;
        const distinctCenters = (a, b) => ["x", "y", "z"].some((axis) => a[axis] !== b[axis]);
        check(
          `skin ${skin} exposes the full ship contract`,
          Boolean(report) &&
            ["leftWing", "rightWing", "leftTail", "rightTail", "cockpit", "leftEngine", "rightEngine"].every(
              (key) => report.parts[key] && Number.isFinite(report.parts[key].x)
            ) &&
            report.parts.leftEngine.x * report.parts.rightEngine.x < 0 &&
            distinctCenters(report.parts.cockpit, report.parts.leftEngine) &&
            distinctCenters(report.parts.cockpit, report.parts.rightEngine) &&
            distinctCenters(report.parts.leftTail, report.parts.rightTail) &&
            // Task 7 will assert saucer wing separation after building real lateral surfaces.
            (skin === "saucer" || report.parts.leftWing.x * report.parts.rightWing.x < 0) &&
            report.navLights.length === 2 &&
            report.navLights.some((light) => light.color === "#ff4d5e" && light.x > 0) &&
            report.navLights.some((light) => light.color === "#4dff9e" && light.x < 0) &&
            report.flameCount >= 2 &&
            report.bounds.x > 0 &&
            report.bounds.y > 0 &&
            report.bounds.z > 0
        );
      }
      api.selectSkin("delta");
      const deltaShip = api.getWorldDebug().fighter;
      check(
        "delta skin is a wide flying wing with separate wing meshes",
        deltaShip.bounds.x / deltaShip.bounds.z > 1.4 &&
          deltaShip.bounds.y / deltaShip.bounds.z < 0.34 &&
          deltaShip.parts.leftWing.x < 0 &&
          deltaShip.parts.rightWing.x > 0 &&
          deltaShip.parts.cockpit.z > 0
      );
      api.selectSkin("default");

      const pad = 60 + 26;
      const limit = 60000 - pad;
      const faces = [
        [60100, 30000, 30000],
        [-100, 30000, 30000],
        [30000, 60100, 30000],
        [30000, -100, 30000],
        [30000, 30000, 60100],
        [30000, 30000, -100]
      ];
      let boundaryHeld = true;
      for (const [x, y, z] of faces) {
        api.setPlayerPosition(x, y, z);
        for (let frame = 0; frame < 60; frame += 1) {
          api.clearAsteroids();
          api.tick(1 / 60);
        }
        const q = api.getScene().player;
        boundaryHeld =
          boundaryHeld &&
          q.x >= pad - 0.01 && q.x <= limit + 0.01 &&
          q.y >= pad - 0.01 && q.y <= limit + 0.01 &&
          q.z >= pad - 0.01 && q.z <= limit + 0.01;
      }
      check("soft boundary holds on all six faces", boundaryHeld);

      const outward = [
        [59900, 30000, 30000, -Math.PI / 2, 0],
        [100, 30000, 30000, Math.PI / 2, 0],
        [30000, 59900, 30000, 0, 1.1],
        [30000, 100, 30000, 0, -1.1],
        [30000, 30000, 59900, 0, 0],
        [30000, 30000, 100, Math.PI, 0]
      ];
      let gatesInside = true;
      for (const [x, y, z, yaw, pitch] of outward) {
        api.setPlayerPosition(x, y, z, yaw, pitch);
        api.beginRouteChoice();
        for (const gate of api.getState().gates) {
          gatesInside =
            gatesInside &&
            gate.x >= 120 && gate.x <= 59880 &&
            gate.y >= 120 && gate.y <= 59880 &&
            gate.z >= 120 && gate.z <= 59880;
        }
      }
      check("warp gates stay inside the arena from every direction", gatesInside);

      api.startGame();
      await nextFrames(win, 2);
      api.clearAsteroids();
      const flightStart = api.getScene().player;
      win.dispatchEvent(new win.KeyboardEvent("keydown", { key: "w" }));
      for (let i = 0; i < 3600; i += 1) {
        api.clearAsteroids();
        api.tick(1 / 60);
      }
      win.dispatchEvent(new win.KeyboardEvent("keyup", { key: "w" }));
      const flightEnd = api.getScene().player;
      const travelled = Math.hypot(
        flightEnd.x - flightStart.x,
        flightEnd.y - flightStart.y,
        flightEnd.z - flightStart.z
      );
      check(
        "sixty seconds of forward flight stays inside the open arena",
        travelled > 19000 && travelled < 20500 &&
          flightEnd.z > 49000 && flightEnd.z < 50500
      );

      const showcaseFrame = document.createElement("iframe");
      showcaseFrame.src = "../showcase.html?test=1";
      showcaseFrame.width = 1280;
      showcaseFrame.height = 900;
      showcaseFrame.style.cssText = "position:absolute;left:-16000px;top:0;border:0;";
      const showcaseLoaded = new Promise((resolve, reject) => {
        const cleanup = () => {
          clearTimeout(timer);
          showcaseFrame.onload = null;
          showcaseFrame.onerror = null;
        };
        const fail = (message) => {
          cleanup();
          showcaseFrame.remove();
          reject(new Error(message));
        };
        const timer = setTimeout(() => fail("timed out loading showcase.html after 20000 ms"), 20000);
        showcaseFrame.onload = () => {
          cleanup();
          resolve(showcaseFrame.contentWindow);
        };
        showcaseFrame.onerror = () => fail("failed to load showcase.html");
      });
      document.body.append(showcaseFrame);
      const showcaseWin = await showcaseLoaded;
      const showcase = await waitFor(
        () => (showcaseWin.starRingShowcaseReady ? showcaseWin.starRingShowcase : null),
        20000
      );
      const showcaseHref = win.document.getElementById("showcase-link")?.getAttribute("href") || "";
      const showcaseDoc = showcaseWin.document;
      const wideReport = showcase.getDebugReport();
      showcase.selectView("rewards");
      showcaseFrame.width = 390;
      showcaseFrame.height = 844;
      await nextFrames(showcaseWin, 3);
      const rewardsReport = showcase.getDebugReport();
      check(
        "showcase loads real models, links from the game, and fits a narrow viewport",
        showcaseHref.startsWith("showcase.html") &&
          Boolean(showcaseDoc.querySelector(".stage-fallback")) &&
          wideReport.models.ship === 1 &&
          wideReport.models.rewards === 3 &&
          wideReport.models.rocks === 3 &&
          wideReport.pickupVariants.join(",") === "core,shield,double" &&
          wideReport.rockForms.length === 3 &&
          rewardsReport.view === "rewards" &&
          rewardsReport.canvas.width > 0 &&
          rewardsReport.canvas.height > 0 &&
          rewardsReport.canvas.width < wideReport.canvas.width
      );

      // Terminal check: no game API assertions may follow world disposal.
      api.startGame();
      api.clearAsteroids();
      api.setPlayerPosition(30000, 30000, 30000, 0, 0);
      api.destroyAsteroidAt(30000, 30000, 30200, 30, false);
      api.tick(1 / 60);
      const beforeDispose = api.getWorldDebug().fx;
      const afterDispose = api.disposeWorld();
      check("world disposal releases live FX and its shared ring geometry",
        beforeDispose.debrisGroups === 1 && beforeDispose.materials === materialsPerGroup &&
          afterDispose.debrisGroups === 0 && afterDispose.shards === 0 && afterDispose.sparks === 0 &&
          afterDispose.rings === 0 && afterDispose.flashes === 0 && afterDispose.materials === 0 &&
          afterDispose.stats.disposedMaterials - beforeDispose.stats.disposedMaterials === materialsPerGroup &&
          afterDispose.stats.disposedGeometries - beforeDispose.stats.disposedGeometries === 1 &&
          afterDispose.stats.disposedMaterials === afterDispose.stats.createdMaterials &&
          afterDispose.stats.disposedGeometries === afterDispose.stats.createdGeometries &&
          afterDispose.stats.disposedRingGeometries - beforeDispose.stats.disposedRingGeometries === 1);
    } catch (error) {
      result.error = error.message;
    }
    finish();
  };
  document.body.append(frame);
</script>
